<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socratop - 专业运动数据平台</title>
    <meta name="description" content="专业运动数据平台，致力于为运动爱好者提供全方位的数据分析和管理服务。">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .content {
            text-align: center;
            padding: 60px 0;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 2rem;
            letter-spacing: 2px;
        }

        .description {
            font-size: 1.2rem;
            color: #666;
            line-height: 1.8;
            margin-bottom: 1.5rem;
        }

        .footer {
            background-color: #f8f9fa;
            padding: 20px 0;
            text-align: center;
            border-top: 1px solid #e9ecef;
        }

        .beian-link {
            color: #666;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        .beian-link:hover {
            color: #007bff;
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
                margin-bottom: 1.5rem;
            }

            .description {
                font-size: 1.1rem;
            }

            .container {
                padding: 0 15px;
            }

            .content {
                padding: 40px 0;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
            }

            .description {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content">
            <h1>Socratop</h1>

            <div class="description">
                <p>专业运动数据平台，致力于为运动爱好者提供全方位的数据分析和管理服务。</p>
            </div>

            <div class="description">
                <p>我们专注于运动数据的收集、分析与可视化，帮助用户更好地了解自己的运动表现。</p>
            </div>

            <div class="description">
                <p>通过科学的数据分析，让每一次运动都更有意义。</p>
            </div>
        </div>
    </div>

    <footer class="footer">
        <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer" class="beian-link">
            沪ICP备2025142025号
        </a>
    </footer>
</body>
</html>
